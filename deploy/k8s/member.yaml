apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: em
spec:
  selector: {app: member}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member
  namespace: em
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: member}
  template:
    metadata:
      labels: {app: member}
    spec:
      containers:
        - name: member
          image: em-member:local
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

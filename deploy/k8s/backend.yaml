apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: em
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: em
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: em-backend:local
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env:
            - {name: DB_URL, value: 'jdbc:postgresql://postgres:5432/giving'}
            - {name: DB_USER, value: giving}
            - {name: TZ, value: Asia/Kolkata}
          envFrom:
            - secretRef: {name: em-secrets}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
